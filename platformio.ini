; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = lilygo-t7-s3

; Settings shared by all boards
[env]
platform = espressif32@6.4.0
framework = arduino
monitor_speed = 460800
upload_speed = 921600
monitor_filters = esp32_exception_decoder
build_flags = 
    -DENABLE_GxEPD2_GFX=1
    -DMAX_DISPLAY_BUFFER_SIZE=65536
    -DMAX_HEIGHT_3C=200
    -DCORE_DEBUG_LEVEL=1
lib_deps = 
    zinggjm/GxEPD2@^1.5.5
    olikraus/U8g2@^2.36.5
    bblanchon/ArduinoJson@^6.21.3
    https://github.com/olikraus/U8g2_for_Adafruit_GFX.git
    SPI
    FS
    SPIFFS
    SD
    WiFi
    HTTPClient
    https://github.com/ESP32Async/ESPAsyncWebServer.git
    https://github.com/ESP32Async/AsyncTCP.git
    DNSServer
    ricmoo/qrcode@^0.0.1
board_build.filesystem = spiffs

; Board-specific pins and display settings live in include/board_*.h,
; selected by the BOARD_* flag below (see include/boards.h).

; LilyGO T7-S3 + Waveshare 7.3" e-Paper HAT (E) (default)
[env:lilygo-t7-s3]
board = lilygo-t7-s3
upload_resetmethod = usb
build_flags = 
    ${env.build_flags}
    -DBOARD_LILYGO_T7_S3
    -DARDUINO_USB_CDC_ON_BOOT=1

; Seeed Studio reTerminal E1002
[env:reterminal-e1002]
board = seeed_xiao_esp32s3
; USB-C is wired to a CH340 USB-serial bridge (UART0), not the native USB port
monitor_speed = 115200
upload_speed = 460800
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1
build_flags = 
    ${env.build_flags}
    -DBOARD_RETERMINAL_E1002
    -DARDUINO_USB_CDC_ON_BOOT=0
