; Standalone firmware that writes files sent over USB serial to the microSD card.
; Flash it, run upload.py, then flash the main firmware again. See README.md.

[platformio]
default_envs = reterminal-e1002

[env:reterminal-e1002]
platform = espressif32@6.4.0
framework = arduino
board = seeed_xiao_esp32s3
monitor_speed = 460800
upload_speed = 460800
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -DBOARD_RETERMINAL_E1002
    -DARDUINO_USB_CDC_ON_BOOT=0
    -I../../include
lib_deps =
    SPI
    FS
    SD
